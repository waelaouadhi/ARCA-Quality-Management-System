apiVersion: v1
kind: Secret
metadata:
  name: qms-backend-secret
type: Opaque
immutable: true
stringData:
  POSTGRES_DB: qms_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-this-postgres-password
  DATABASE_URL: postgresql://postgres:change-this-postgres-password@postgres.default.svc.cluster.local:5432/qms_db
  JWT_SECRET: change-this-to-a-strong-32-plus-character-secret
