apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: qms-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.qms-observability.svc.cluster.local:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: qms-backend
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - qms-staging
                - qms-production
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_service_name
            action: keep
            regex: qms-backend
          - source_labels:
              - __meta_kubernetes_endpoint_port_name
            action: keep
            regex: http
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.qms-observability.svc.cluster.local:8080
