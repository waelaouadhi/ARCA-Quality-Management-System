apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: qms-observability
data:
  alertmanager.yml: |
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      receiver: default-null
    receivers:
      - name: default-null
