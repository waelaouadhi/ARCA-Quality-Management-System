apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qms-backend-hpa
  labels:
    app: qms-backend
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qms-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
