name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy (required for production promotion)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/qms_ci
      JWT_SECRET: CI-Test-Secret-Only-Change-In-Prod-1234!
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Sync test database schema
        run: npx prisma db push --force-reset

      - name: Sanity check synced schema
        run: |
          npx prisma db pull --print > /tmp/introspected-schema.prisma
          grep -q '^model ' /tmp/introspected-schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set image reference
        id: image-ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (push on main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image-ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        if: github.ref == 'refs/heads/main'
        run: |
          docker run --rm aquasec/trivy:0.57.1 image \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${{ steps.image-ref.outputs.image }}"

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Sign image with Cosign (keyless)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.image-ref.outputs.image }}"

  cd-preflight:
    name: CD preflight
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment || 'production' }}
    outputs:
      ready: ${{ steps.check-secrets.outputs.ready }}
    steps:
      - name: Check deployment secrets
        id: check-secrets
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=()
          [ -z "$KUBE_CONFIG_DATA" ] && missing+=("KUBE_CONFIG_DATA")
          [ -z "$DATABASE_URL" ] && missing+=("DATABASE_URL")
          [ -z "$JWT_SECRET" ] && missing+=("JWT_SECRET")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CD skipped. Missing secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  cd:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [ci, cd-preflight]
    if: github.ref == 'refs/heads/main' && needs.cd-preflight.outputs.ready == 'true'
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment || 'production' }}
    timeout-minutes: 15
    steps:
      - name: Resolve deployment target
        id: deploy-config
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            target_env="staging"
          else
            target_env="${{ github.event.inputs.deploy_environment }}"
          fi

          if [ "$target_env" = "production" ] && [ -z "${{ github.event.inputs.image_tag }}" ]; then
            echo "::error::Production promotion requires workflow_dispatch input 'image_tag' (typically a tested commit SHA)."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.event.inputs.image_tag }}"
          else
            image="${{ needs.ci.outputs.image }}"
          fi

          if [ "$target_env" = "production" ]; then
            namespace="qms-production"
            overlay="production"
          else
            namespace="qms-staging"
            overlay="staging"
          fi

          echo "target_env=$target_env" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          echo "overlay=$overlay" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Verify image signature
        run: |
          cosign verify "${{ steps.deploy-config.outputs.image }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/waelaouadhi/ARCA-Quality-Management-System/.github/workflows/ci-cd.yml@refs/heads/main$"

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure namespace exists
        run: kubectl get namespace "${{ steps.deploy-config.outputs.namespace }}" >/dev/null 2>&1 || kubectl create namespace "${{ steps.deploy-config.outputs.namespace }}"

      - name: Apply observability stack
        run: kubectl apply -k k8s/monitoring

      - name: Configure alert delivery webhook
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::ALERT_WEBHOOK_URL is not set. Alertmanager will keep default null receiver."
            exit 0
          fi

          cat <<EOF > /tmp/alertmanager.yml
          route:
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1h
            receiver: webhook-default
          receivers:
            - name: webhook-default
              webhook_configs:
                - url: '${ALERT_WEBHOOK_URL}'
                  send_resolved: true
          EOF

          kubectl create configmap alertmanager-config \
            --namespace qms-observability \
            --from-file=alertmanager.yml=/tmp/alertmanager.yml \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl rollout restart deployment/alertmanager --namespace qms-observability

      - name: Wait for observability components
        id: observability
        continue-on-error: true
        run: |
          kubectl rollout status deployment/prometheus --namespace qms-observability --timeout=180s
          kubectl rollout status deployment/alertmanager --namespace qms-observability --timeout=180s
          kubectl rollout status deployment/kube-state-metrics --namespace qms-observability --timeout=180s
          kubectl rollout status deployment/grafana --namespace qms-observability --timeout=180s

      - name: Create/Update runtime secret
        run: |
          kubectl create secret generic qms-backend-secret \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --namespace "${{ steps.deploy-config.outputs.namespace }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes overlay
        run: |
          kubectl apply -k "k8s/overlays/${{ steps.deploy-config.outputs.overlay }}"

      - name: Update backend image
        run: |
          kubectl set image deployment/qms-backend \
            qms-backend="${{ steps.deploy-config.outputs.image }}" \
            --namespace "${{ steps.deploy-config.outputs.namespace }}"

      - name: Annotate deployment traceability
        run: |
          kubectl annotate deployment/qms-backend \
            ci.github.com/actor="${{ github.actor }}" \
            ci.github.com/sha="${{ github.sha }}" \
            ci.github.com/run-id="${{ github.run_id }}" \
            ci.github.com/environment="${{ steps.deploy-config.outputs.target_env }}" \
            --overwrite \
            --namespace "${{ steps.deploy-config.outputs.namespace }}"

      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: kubectl rollout status deployment/qms-backend --timeout=180s --namespace "${{ steps.deploy-config.outputs.namespace }}"

      - name: Smoke test backend service
        id: smoke
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        run: |
          kubectl run qms-smoke-${{ github.run_id }} \
            --image=curlimages/curl:8.8.0 \
            --namespace "${{ steps.deploy-config.outputs.namespace }}" \
            --restart=Never \
            --attach \
            --rm \
            --command -- sh -c "curl -fsS http://qms-backend:4000/health"

      - name: Verify metrics endpoint
        id: metrics
        if: steps.rollout.outcome == 'success'
        continue-on-error: true
        run: |
          kubectl run qms-metrics-${{ github.run_id }} \
            --image=curlimages/curl:8.8.0 \
            --namespace "${{ steps.deploy-config.outputs.namespace }}" \
            --restart=Never \
            --attach \
            --rm \
            --command -- sh -c "curl -fsS http://qms-backend:4000/metrics | grep -q 'qms_backend_http_requests_total'"

      - name: Verify alert rules loaded
        id: alert_rules
        if: steps.observability.outcome == 'success'
        continue-on-error: true
        run: |
          kubectl run qms-alert-rules-${{ github.run_id }} \
            --image=curlimages/curl:8.8.0 \
            --namespace qms-observability \
            --restart=Never \
            --attach \
            --rm \
            --command -- sh -c "curl -fsS http://prometheus:9090/api/v1/rules | grep -q 'QMSHigh5xxRate'"

      - name: Collect deployment diagnostics
        if: steps.observability.outcome != 'success' || steps.rollout.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.metrics.outcome == 'failure' || steps.alert_rules.outcome == 'failure'
        run: |
          kubectl get deploy,pods,svc,hpa --namespace "${{ steps.deploy-config.outputs.namespace }}"
          kubectl describe deployment/qms-backend --namespace "${{ steps.deploy-config.outputs.namespace }}"
          kubectl describe pod -l app=qms-backend --namespace "${{ steps.deploy-config.outputs.namespace }}"
          kubectl logs deployment/qms-backend --all-containers=true --tail=200 --namespace "${{ steps.deploy-config.outputs.namespace }}"
          kubectl get deploy,pods,svc --namespace qms-observability
          kubectl logs deployment/prometheus --tail=200 --namespace qms-observability || true
          kubectl logs deployment/alertmanager --tail=200 --namespace qms-observability || true

      - name: Roll back on deployment failure
        if: steps.rollout.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.metrics.outcome == 'failure'
        run: |
          kubectl rollout undo deployment/qms-backend --namespace "${{ steps.deploy-config.outputs.namespace }}"
          kubectl rollout status deployment/qms-backend --timeout=180s --namespace "${{ steps.deploy-config.outputs.namespace }}" || true

      - name: Fail workflow when deployment checks fail
        if: steps.observability.outcome != 'success' || steps.rollout.outcome != 'success' || steps.smoke.outcome == 'failure' || steps.metrics.outcome == 'failure' || steps.alert_rules.outcome == 'failure'
        run: exit 1
