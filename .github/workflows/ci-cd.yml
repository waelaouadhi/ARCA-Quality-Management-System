name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image-ref.outputs.image }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/qms_ci
      JWT_SECRET: CI-Test-Secret-Only-Change-In-Prod-1234!
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Create CI environment file from .env.example
        run: |
          cp .env.example .env
          sed -i 's|^NODE_ENV=.*|NODE_ENV=test|' .env
          sed -i 's|^PORT=.*|PORT=4000|' .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:password@localhost:5432/qms_ci|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=CI-Test-Secret-Only-Change-In-Prod-1234!|' .env
          sed -i 's|^CORS_ORIGIN=.*|CORS_ORIGIN=http://localhost:3000|' .env
          sed -i 's|^LOG_LEVEL=.*|LOG_LEVEL=info|' .env

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Reset test database schema
        run: npx prisma migrate reset --force --skip-seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Set image reference
        id: image-ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image-ref.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create/Update runtime secret
        run: |
          kubectl create secret generic qms-backend-secret \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml

      - name: Update backend image
        run: |
          kubectl set image deployment/qms-backend \
            qms-backend=${{ needs.ci.outputs.image }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/qms-backend --timeout=180s
